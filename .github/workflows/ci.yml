name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: /api/cashier
          VITE_BASE_PATH: /cashier/
        run: npm run build
